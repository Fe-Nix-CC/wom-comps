name: Weekly Comps Generation

on:
  schedule:
    # Runs at 04:52 UTC (2:52 PM AEST) every Thursday
    - cron: "52 4 * * 4"
  workflow_dispatch:

jobs:
  execute-command:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run create-comps
        run: pnpm run create-comps
        env:
          COMP_DURATION: week
          WOM_GROUP_ID: 24867
          WOM_GROUP_KEY: ${{ secrets.WOM_GROUP_KEY }}
          WOM_API_USER_AGENT: sosomuch
